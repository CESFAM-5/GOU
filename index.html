<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GES - CESFAM N°5</title>
  <style>
    :root {
      --verde: #3B5F7A;
      --verde-claro: #E8EFF5;
      --verde-medio: #4E7A9B;
      --texto: #3d3d3a;
      --texto-suave: #777;
      --borde: #ddd;
      --fondo: #f4f6f8;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--fondo); color: var(--texto); }
    .container { max-width: 680px; margin: 0 auto; padding: 16px; }
    
    .header { background: linear-gradient(135deg, var(--verde), var(--verde-medio)); color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .header h1 { font-size: 24px; margin-bottom: 8px; }
    .header p { font-size: 14px; opacity: 0.9; }
    
    .info-box { background: var(--verde-claro); border-left: 4px solid var(--verde); padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; line-height: 1.6; }
    .info-box strong { color: var(--verde); }
    
    .sistema { margin-bottom: 24px; }
    .sistema-titulo { font-size: 12px; font-weight: 700; color: var(--verde); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--verde); }
    
    .patologia-item { background: white; border: 1px solid var(--borde); border-radius: 6px; padding: 12px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
    .patologia-item:hover { background: var(--verde-claro); border-color: var(--verde); }
    .patologia-numero { font-weight: 700; color: var(--verde); font-size: 12px; }
    .patologia-nombre { font-size: 14px; color: var(--texto); margin-top: 4px; }
    
    .detalle { display: none; background: white; border: 1px solid var(--borde); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .detalle.activo { display: block; }
    
    .detalle-header { background: linear-gradient(135deg, var(--verde), var(--verde-medio)); color: white; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .detalle-header h2 { font-size: 18px; margin-bottom: 4px; }
    .detalle-header p { font-size: 12px; opacity: 0.9; }
    
    .seccion { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--borde); }
    .seccion:last-child { border-bottom: none; }
    
    .seccion-titulo { font-size: 14px; font-weight: 700; color: var(--verde); margin-bottom: 8px; }
    .seccion-contenido { font-size: 13px; line-height: 1.6; color: var(--texto); }
    
    .seccion-lista { list-style: none; padding: 0; }
    .seccion-lista li { font-size: 13px; line-height: 1.6; padding-left: 16px; position: relative; margin-bottom: 6px; }
    .seccion-lista li:before { content: "✓"; position: absolute; left: 0; color: var(--verde); font-weight: bold; }
    
    .ges-box { background: var(--verde-claro); border-left: 4px solid var(--verde); padding: 12px; border-radius: 6px; }
    .ges-box strong { color: var(--verde); }
    
    .boton-cerrar { background: var(--verde); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-bottom: 16px; }
    .boton-cerrar:hover { background: var(--verde-medio); }
    
    .loading { text-align: center; padding: 40px; color: var(--texto-suave); }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Ley GES</h1>
    <p>Garantías Explícitas en Salud - CESFAM N°5</p>
  </div>

  <div class="info-box">
    <strong>¿Qué es GES?</strong><br>
    Es una ley que garantiza acceso, calidad, oportunidad y protección financiera en la atención de 90 problemas de salud priorizados. Aquí encontrarás las patologías GES atendidas en el CESFAM N°5.
  </div>

  <div id="gesContainer" class="loading">Cargando patologías...</div>
  <div id="detalleContainer"></div>
</div>

<script>
let DATOS_GES = [];

// Cargar datos
fetch('./data/ges-patologias-estructura-definitiva.json')
  .then(r => r.json())
  .then(data => {
    DATOS_GES = data;
    renderizarListado();
    console.log('✅ GES cargado:', DATOS_GES.length, 'patologías');
  })
  .catch(err => {
    console.error('❌ Error:', err);
    document.getElementById('gesContainer').innerHTML = '<p style="color: red;">Error al cargar GES: ' + err.message + '</p>';
  });

// Agrupar por clasificación
function agruparPorClasificacion() {
  const grupos = {};
  DATOS_GES.forEach(pat => {
    const sist = pat.clasificacion || 'Otras';
    if (!grupos[sist]) grupos[sist] = [];
    grupos[sist].push(pat);
  });
  return grupos;
}

// Renderizar listado agrupado
function renderizarListado() {
  if (!DATOS_GES.length) return;

  const grupos = agruparPorClasificacion();
  const sistemas = Object.keys(grupos).sort();

  let html = '';
  sistemas.forEach(sistema => {
    const pats = grupos[sistema].sort((a, b) => a.ges_numero - b.ges_numero);
    
    html += `<div class="sistema">
      <div class="sistema-titulo">${sistema}</div>`;
    
    pats.forEach(pat => {
      html += `<div class="patologia-item" onclick="mostrarDetalle('${pat.id}')">
        <div class="patologia-numero">GES Nº ${pat.ges_numero}</div>
        <div class="patologia-nombre">${pat.nombre_corto}</div>
      </div>`;
    });
    
    html += '</div>';
  });

  document.getElementById('gesContainer').innerHTML = html;
}

// Mostrar detalle de patología
function mostrarDetalle(id) {
  const pat = DATOS_GES.find(p => p.id === id);
  if (!pat) return;

  const sec = pat.secciones;
  
  let html = `
    <div class="detalle activo">
      <button class="boton-cerrar" onclick="cerrarDetalle()">← Volver</button>
      
      <div class="detalle-header">
        <h2>${pat.nombre_completo}</h2>
        <p>GES Nº ${pat.ges_numero}</p>
      </div>
      
      ${sec.descripcion ? `
        <div class="seccion">
          <div class="seccion-titulo">${sec.descripcion.titulo}</div>
          <div class="seccion-contenido">${sec.descripcion.contenido}</div>
        </div>
      ` : ''}
      
      ${sec.sintomas ? `
        <div class="seccion">
          <div class="seccion-titulo">${sec.sintomas.titulo}</div>
          <ul class="seccion-lista">
            ${sec.sintomas.items.map(item => `<li>${item}</li>`).join('')}
          </ul>
          ${sec.sintomas.nota ? `<p style="font-size:12px; color:var(--texto-suave); margin-top:8px; font-style:italic;"><strong>Nota:</strong> ${sec.sintomas.nota}</p>` : ''}
        </div>
      ` : ''}
      
      ${sec.prestaciones ? `
        <div class="seccion">
          <div class="seccion-titulo">${sec.prestaciones.titulo}</div>
          <ul class="seccion-lista">
            ${sec.prestaciones.items.map(item => `<li>${item}</li>`).join('')}
          </ul>
        </div>
      ` : ''}
      
      ${sec.requisitos ? `
        <div class="seccion">
          <div class="seccion-titulo">${sec.requisitos.titulo}</div>
          <ul class="seccion-lista">
            ${sec.requisitos.items.map(item => `<li>${item}</li>`).join('')}
          </ul>
        </div>
      ` : ''}
      
      ${sec.acceso ? `
        <div class="seccion">
          <div class="seccion-titulo">${sec.acceso.titulo}</div>
          <div class="seccion-contenido">${sec.acceso.contenido}</div>
        </div>
      ` : ''}
      
      ${sec.horario ? `
        <div class="seccion">
          <div class="seccion-titulo">${sec.horario.titulo}</div>
          <div class="seccion-contenido">${sec.horario.contenido}</div>
        </div>
      ` : ''}
      
      ${sec.saber_mas ? `
        <div class="seccion">
          <div class="seccion-titulo">${sec.saber_mas.titulo}</div>
          <div class="seccion-contenido">
            ${sec.saber_mas.contenido}
            ${sec.saber_mas.url ? `<br><a href="${sec.saber_mas.url}" target="_blank" style="color:var(--verde); text-decoration:none; font-weight:500; border-bottom:1px solid var(--verde);">Ver más en Superintendencia de Salud →</a>` : ''}
          </div>
        </div>
      ` : ''}
      
      ${sec.ges ? `
        <div class="seccion ges-box">
          <div class="seccion-titulo">${sec.ges.titulo}</div>
          ${sec.ges.cobertura ? `<div style="margin-bottom:8px;"><strong>Cobertura:</strong> ${sec.ges.cobertura}</div>` : ''}
          ${sec.ges.plazo_sospecha ? `<div style="margin-bottom:8px;"><strong>Plazo (sospecha):</strong> ${sec.ges.plazo_sospecha}</div>` : ''}
          ${sec.ges.plazo_confirmacion ? `<div style="margin-bottom:8px;"><strong>Plazo (confirmación):</strong> ${sec.ges.plazo_confirmacion}</div>` : ''}
          ${sec.ges.copago_fonasa ? `<div style="margin-bottom:8px;"><strong>Copago FONASA:</strong> ${sec.ges.copago_fonasa}</div>` : ''}
          ${sec.ges.copago_isapre ? `<div><strong>Copago ISAPRE:</strong> ${sec.ges.copago_isapre}</div>` : ''}
        </div>
      ` : ''}
    </div>
  `;

  document.getElementById('detalleContainer').innerHTML = html;
  window.scrollTo(0, 0);
}

// Cerrar detalle
function cerrarDetalle() {
  document.getElementById('detalleContainer').innerHTML = '';
}
</script>

</body>
</html>
